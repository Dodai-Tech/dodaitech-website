[package]
name         = "dodaitech-website"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.90"
publish      = false
license      = "MIT"
authors      = ["Sorin Albu-Irimies"]
repository   = "https://github.com/Dodai-Tech/dodaitech-website"
description  = "The Dodai Tech website: a Rust generator that writes the static site published to Cloudflare"
readme       = "README.md"

[dependencies]
dodai-core    = { version = "0.1", features = ["dodai"] }
dodai-icons   = "0.1"
dodai-topcoat = "0.1"
dodai-shaders = "0.1"
image         = { version = "0.25", default-features = false, features = ["jpeg"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
# `pub` only for what another crate uses; then dead_code finds the rest.
unreachable_pub = "warn"
# Dead weight the compiler can see: -D warnings in the gate makes these errors.
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
unused_macro_rules = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
wildcard_imports = "warn"
enum_glob_use = "warn"
unused_self = "warn"
used_underscore_binding = "warn"
mod_module_files = "warn"
allow_attributes_without_reason = "warn"
manual_let_else = "warn"
redundant_clone = "warn"
uninlined_format_args = "warn"
too_many_arguments = "warn"
cognitive_complexity = "warn"
too_many_lines = "warn"

# Slim and fast: `just bloat` shows what costs size, scripts/ci/size_budget.nu enforces the budget.
# `opt-level = "s"` favours size over speed; use 3 (or "z" for smallest) per project, with a reason.
# `panic = "abort"` drops the unwinding tables; remove it only for a binary that catches panics.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
